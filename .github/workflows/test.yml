name: Test Dotfiles

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and isolated regression tests
        run: bash scripts/check.sh
      - name: Dry run personal install
        env:
          CI: true
        run: ./install.sh --profile personal --dry-run

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and isolated regression tests
        run: bash scripts/check.sh
      - name: Dry run personal install
        env:
          CI: true
        run: ./install.sh --profile personal --dry-run
